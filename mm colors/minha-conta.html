<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Conta - MM Colors</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial; }
    body { background: #f5f5f5; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { color: #FF6B35; margin-bottom: 15px; }
    button { background: #666; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    .btn-sair { background: #dc3545; margin-left: 10px; }
    .info { margin-bottom: 10px; }
    nav a { margin-right: 15px; color: #FF6B35; text-decoration: none; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>Minha Conta</h2>
    <div id="dados"></div>
    <button onclick="window.location.href='loja.html'">Voltar à Loja</button>
    <button class="btn-sair" onclick="logout()">Sair</button>
  </div>
</div>

<script>
  function carregarCliente() {
    const cliente = localStorage.getItem('cliente');
    if (!cliente) {
      window.location.href = 'login-cliente.html';
      return;
    }
    const dados = JSON.parse(cliente);
    document.getElementById('dados').innerHTML = `
      <div class="info"><strong>Nome:</strong> ${dados.nome}</div>
      <div class="info"><strong>E-mail:</strong> ${dados.email}</div>
    `;
  }

  function logout() {
    localStorage.removeItem('cliente');
    window.location.href = 'loja.html';
  }

  carregarCliente();
</script>
</body>
</html>
